[package]
name = "morse-copy"
version = "1.0.0"
edition = "2021"

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8.20", features = ["csr"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-events = "0.2"
futures = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "AudioBuffer", "AudioBufferSourceNode", "AudioContext", "AudioContextState",
  "AudioDestinationNode", "AudioNode", "AudioParam", "AudioScheduledSourceNode",
  "AudioWorklet", "AudioWorkletNode", "BiquadFilterNode", "BiquadFilterType",
  "CustomEvent", "Document", "EventTarget", "GainNode", "HtmlDialogElement", "HtmlInputElement", "MediaDevices",
  "MediaStream", "MediaStreamAudioSourceNode", "MediaStreamConstraints",
  "MediaStreamTrack", "MediaTrackConstraints", "MessageEvent", "MessagePort",
  "Navigator", "OscillatorNode", "Performance", "Response", "Storage", "SubmitEvent", "Url", "Window", "Worker", "Worklet",
] }
